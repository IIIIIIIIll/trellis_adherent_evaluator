[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "notes-cli"
version = "0.1.0"
description = "Tiny command-line notes app"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
notes = "notes.cli:main"

[tool.setuptools]
packages = ["notes"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
